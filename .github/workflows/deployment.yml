name: Deploy to Cloudflare Pages
on:
  push:
    branches: [fix/approved-issues-20261103]
    paths: [.github/workflows/deployment.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-online-spacing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - name: Check deployed entry and API health
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const base = 'https://fptux-clubhub-ui.pages.dev';
          const response = await fetch(base + '/v2/activities/4?verification='+Date.now());
          assert.equal(response.status,200);
          const html = await response.text();
          assert.ok(html.includes('/assets/index-CG1OEQWD.js'));
          for(const path of ['/assets/index-CG1OEQWD.js', ...[...html.matchAll(/(?:src|href)="(\/assets\/[^"]+)"/g)].map(match=>match[1])]) {
            const asset = await fetch(base + path);
            console.log('ASSET_STATUS',path,asset.status,asset.headers.get('content-type'));
            assert.equal(asset.status,200);
          }
          assert.equal((await fetch('https://clubreporthub.duckdns.org/health')).status,200);
          console.log('ONLINE_SPACING_ASSETS_OK');
          NODE
      - run: node scripts/deployed-activity-registration-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: online-spacing-screenshots
          path: TestResults/deployed-registration
