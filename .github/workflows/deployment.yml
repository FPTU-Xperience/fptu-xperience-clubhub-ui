name: Deploy to Cloudflare Pages
on:
  push:
    branches: [fix/approved-issues-20261103]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-deployed-registration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - name: Verify actual deployed activity route with all API traffic intercepted
        run: node scripts/deployed-activity-registration-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployed-registration-browser-evidence
          path: TestResults/deployed-registration
