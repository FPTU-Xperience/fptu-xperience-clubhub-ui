name: Deploy to Cloudflare Pages
on:
    push:
        branches: [fix/approved-issues-20261103]
        paths: [.github/workflows/deployment.yml]
    workflow_dispatch:
permissions:
    contents: read
jobs:
    audit-deployed-source:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/setup-node@v4
              with:
                  node-version: '20'
            - name: Compare actual production and branch assets
              env:
                  CF_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOYMENT_TOKEN }}
                  CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
              run: |
                  node --input-type=module <<'NODE'
                  const cf = 'https://api.cloudflare.com/client/v4/accounts/' + process.env.CF_ACCOUNT + '/pages/projects/fptux-clubhub-ui';
                  const response = await fetch(cf, { headers: { Authorization: 'Bearer ' + process.env.CF_TOKEN } });
                  if (!response.ok) throw new Error('Cloudflare project read failed: ' + response.status);
                  const project = (await response.json()).result;
                  console.log('PROJECT_PRODUCTION', JSON.stringify({ branch: project.production_branch, domains: project.domains,
                    canonical: project.canonical_deployment?.url, source: project.canonical_deployment?.deployment_trigger?.metadata?.commit_hash }));
                  const origins = new Set(['https://fptux-clubhub-ui.pages.dev', 'https://main.fptux-clubhub-ui.pages.dev',
                    ...(project.domains || []).map(domain => 'https://' + domain),
                    ...(project.canonical_deployment?.aliases || [])]);
                  for (const origin of [...origins].slice(0, 8)) {
                    try {
                      const html = await (await fetch(origin + '/v2/activities/1?verification=' + Date.now())).text();
                      const entries = [...html.matchAll(/<script[^>]+src="([^"]+\.js)"/g)].map(match => new URL(match[1], origin).href);
                      const queue = [...entries], seen = new Set();
                      let registration = false, refresh = false;
                      while (queue.length && seen.size < 30) {
                        const url = queue.shift();
                        if (seen.has(url)) continue;
                        seen.add(url);
                        const result = await fetch(url);
                        if (!result.ok) continue;
                        const js = await result.text();
                        registration ||= js.includes('v2-student-activity-actions');
                        refresh ||= js.includes('refreshKey');
                        for (const match of js.matchAll(/["']([^"'\s]+\.js)["']/g)) {
                          const ref = match[1];
                          if (!/[-_][a-zA-Z0-9_-]{6,}\.js$/.test(ref)) continue;
                          const target = new URL(ref.startsWith('assets/') ? '/' + ref : ref, url).href;
                          if (new URL(target).origin === new URL(origin).origin) queue.push(target);
                        }
                      }
                      console.log('ORIGIN_ASSETS', JSON.stringify({ origin, entries, scanned: seen.size, registration, refresh }));
                    } catch (error) { console.log('ORIGIN_READ_FAILED', origin, error.message); }
                  }
                  NODE
