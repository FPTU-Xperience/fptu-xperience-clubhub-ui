name: Deploy to Cloudflare Pages

on:
    workflow_dispatch:

permissions:
    contents: read
    deployments: write

jobs:
    deploy-frontend:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'

            - name: Install Dependencies
              run: npm ci

            - name: Build Frontend
              run: npm run build
              env:
                  VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
                  VITE_GOOGLE_CLIENT_ID: ${{ secrets.CLUBHUB_GOOGLE_CLIENT_ID }}

            - name: Set selected branch as Cloudflare production branch
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOYMENT_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  PROJECT_NAME: fptux-clubhub-ui
                  PRODUCTION_BRANCH: ${{ github.ref_name }}
              run: |
                  curl --fail-with-body --silent --show-error --request PATCH \
                    "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}" \
                    --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                    --header "Content-Type: application/json" \
                    --data "{\"production_branch\":\"${PRODUCTION_BRANCH}\"}"

            - name: Deploy to Cloudflare Pages
              uses: cloudflare/wrangler-action@v3
              env:
                  PROJECT_NAME: fptux-clubhub-ui
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_DEPLOYMENT_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  gitHubToken: ${{ github.token }}
                  command: pages deploy ./dist --project-name=${{ env.PROJECT_NAME }} --branch=${{ github.ref_name }} --commit-dirty=true
