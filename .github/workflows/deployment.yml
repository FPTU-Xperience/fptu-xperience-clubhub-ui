name: Deploy to Cloudflare Pages
on:
  push:
    branches: [fix/approved-issues-20261103]
    paths: [.github/workflows/deployment.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-deployed-layout-and-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - name: Verify deployed source and API health
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const response = await fetch('https://fptux-clubhub-ui.pages.dev/v2/activities/4?verification=' + Date.now());
          assert.equal(response.status, 200);
          assert.ok((await response.text()).includes('/assets/index-BcYgOUws.js'));
          assert.equal((await fetch('https://clubreporthub.duckdns.org/health')).status, 200);
          console.log('ONLINE_ASSET_OK index-BcYgOUws.js; API health 200');
          NODE
      - name: Verify exact deployed layout and registration-to-schedule flow
        run: node scripts/deployed-activity-registration-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: online-activity-layout-and-schedule
          path: TestResults/deployed-registration
