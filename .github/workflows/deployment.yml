name: Deploy to Cloudflare Pages

on:
    push:
        branches: [fix/approved-issues-20261103]
        paths: [.github/workflows/deployment.yml]
    workflow_dispatch:

permissions:
    contents: read
    deployments: write

jobs:
    deploy-frontend:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'

            - name: Install Dependencies
              run: npm ci

            - name: Build Frontend
              run: |
                  node --test src/pages/v2/*.test.js src/services/*.test.js tests/*.test.js
                  npm run build
              env:
                  VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
                  VITE_GOOGLE_CLIENT_ID: ${{ secrets.CLUBHUB_GOOGLE_CLIENT_ID }}
                  VITE_ADMIN_APP_URL: ${{ vars.VITE_ADMIN_APP_URL || 'https://fptux-admin-ui.pages.dev' }}
                  VITE_STAFF_SSO_ENABLED: ${{ vars.VITE_STAFF_SSO_ENABLED || 'true' }}
                  VITE_LOGIN_ACCOUNT_SHORTCUTS: ${{ vars.VITE_LOGIN_ACCOUNT_SHORTCUTS || 'false' }}
                  VITE_R2_BUCKET_NAME: ${{ vars.VITE_R2_BUCKET_NAME || 'fptux-cloud-storage' }}
                  VITE_R2_S3_ENDPOINT: ${{ vars.VITE_R2_S3_ENDPOINT || 'https://c2e463013aa669515ae4e2c54843c4ae.r2.cloudflarestorage.com' }}
                  VITE_R2_PUBLIC_BASE_URL: ${{ vars.VITE_R2_PUBLIC_BASE_URL || 'https://pub-3092f35e8d664b8caf203e269232769a.r2.dev' }}

            - name: Resolve configured Cloudflare production branch
              id: deployment
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOYMENT_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  PROJECT_NAME: fptux-clubhub-ui
              run: |
                  set -euo pipefail
                  branch="$(curl --fail --silent --show-error \
                    "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}" \
                    --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                    | jq -er 'select(.success == true) | .result.production_branch | select(type == "string" and length > 0)')"
                  [[ "${branch}" =~ ^[a-zA-Z0-9_./-]+$ ]]
                  git check-ref-format --branch "${branch}" >/dev/null
                  printf 'branch=%s\n' "${branch}" >> "${GITHUB_OUTPUT}"

            - name: Deploy to Cloudflare Pages
              uses: cloudflare/wrangler-action@v3
              env:
                  PROJECT_NAME: fptux-clubhub-ui
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_DEPLOYMENT_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  gitHubToken: ${{ github.token }}
                  command: pages deploy ./dist --project-name=${{ env.PROJECT_NAME }} --branch=${{ steps.deployment.outputs.branch }} --commit-dirty=true
